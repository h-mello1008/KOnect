<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Histórico de Aulas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../../globalstyles/style.css" />
  </head>
  <body>

    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <span class="brand">KO<span>nect</span></span>
          <a href="index.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Painel Principal
          </a>
        </div>
        <div class="fw-bold text-muted">Módulo: Frequência</div>
      </div>
    </nav>

    <main class="container" style="max-width: 800px;">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Meu Histórico de Aulas</h2>
        <p class="text-muted mb-0">Acompanhe seus registros de presença e engajamento nos treinos.</p>
      </div>

      <div class="stat-card p-0 overflow-hidden mb-5">
        <ul class="list-group list-group-flush" id="listaHistoricoAulas">
          <li class="list-group-item bg-transparent text-center text-muted py-5 border-0">
            <div class="spinner-border text-danger mb-2" role="status"></div>
            <p>Buscando listagem de presenças no servidor...</p>
          </li>
        </ul>
      </div>
    </main>

    <script src="../../../js/aluno/historico_aulas.js"></script>
  </body>
</html>
