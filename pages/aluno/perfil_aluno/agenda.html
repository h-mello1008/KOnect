<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Agenda da Semana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../../globalstyles/style.css" />
  </head>
  <body>

    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <span class="brand">KO<span>nect</span></span>
          <a href="index.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Painel Principal
          </a>
        </div>
        <div class="fw-bold text-muted">Módulo: Agenda</div>
      </div>
    </nav>

    <main class="container-fluid px-md-5">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Aulas da Semana</h2>
        <p class="text-muted mb-0">Confira os treinos disponíveis durante a semana.</p>
      </div>

      <div class="row g-3" id="gridAgendaAluno">
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Segunda</div>
            <div id="aulas-aluno-seg"></div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Terça</div>
            <div id="aulas-aluno-ter"></div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Quarta</div>
            <div id="aulas-aluno-qua"></div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Quinta</div>
            <div id="aulas-aluno-qui"></div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Sexta</div>
            <div id="aulas-aluno-sex"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="../../../js/aluno/agenda.js"></script>
  </body>
</html>
