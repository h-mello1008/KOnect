<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KOnect - Histórico de Mensalidades</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/KOnect/css/konect.css" />
  </head>
  <body class="theme-aluno">
    <aside class="sidebar p-4 d-none d-lg-block">
      <div class="brand mb-5">KO<span style="color:var(--accent)">nect</span></div>
      <nav class="nav flex-column gap-2">
        <a href="../perfil_aluno/index.html" class="nav-link text-muted"><i class="bi bi-grid-fill me-2"></i> Início</a>
        <a href="#" class="nav-link text-muted"><i class="bi bi-calendar-check me-2"></i> Minhas Aulas</a>
        <a href="./index.html" class="nav-link text-muted"><i class="bi bi-currency-dollar me-2"></i> Pagamentos</a>
        <a href="./historico.html" class="nav-link text-white active"><i class="bi bi-clock-history me-2"></i> Histórico</a>
        <hr class="my-4 hr-dark" />
        <button id="btnLogout" class="btn btn-outline-danger w-100 text-start"><i class="bi bi-box-arrow-left me-2"></i> Sair</button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="mb-4">
        <h1 class="header-aluno"><i class="bi bi-clock-history me-2"></i> Histórico de Mensalidades</h1>
        <p class="text-muted">Veja todas as mensalidades já lançadas e filtre por situação.</p>
      </header>

      <div class="mb-3 d-flex gap-2 align-items-center">
        <label class="me-2 text-muted">Filtrar por situação:</label>
        <select id="filterStatus" class="form-select w-auto">
          <option value="all">Todas</option>
          <option value="Pago">Pago</option>
          <option value="Pendente">Pendente</option>
          <option value="Vencido">Vencido</option>
        </select>

        <input id="searchInput" class="form-control w-25 ms-3" placeholder="Pesquisar por academia ou modalidade" />
        <button id="btnReset" class="btn btn-outline-secondary ms-2">Limpar</button>
      </div>

      <div class="table-responsive">
        <table class="table table-dark table-striped align-middle">
          <thead>
            <tr>
              <th>Mês</th>
              <th>Valor</th>
              <th>Vencimento</th>
              <th>Situação</th>
              <th>Dias atraso</th>
              <th>Academia</th>
              <th>Modalidade</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="historicoBody">
            <tr><td colspan="8" class="text-center text-muted">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <script src="../../js/aluno/dashboard_aluno.js"></script>
    <script src="../../js/aluno/mensalidade_historico.js"></script>
  </body>
</html>
