<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão KOnect - Academias Ativas</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn-atualizar { padding: 8px 15px; cursor: pointer; }
        #mensagem { margin-top: 10px; color: #555; font-style: italic; }
    </style>
</head>
<body>

    <h2>Lista de Academias Ativas</h2>
    
    <button class="btn-atualizar" onclick="buscarAcademias()">Atualizar Lista</button>
    <div id="mensagem"></div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome da Academia</th>
                <th>Responsável</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
            </tbody>
    </table>

    <script src="../../../js/admin/get_academias.js"></script>
</body>
</html>
