<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão KOnect - Academias Ativas</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/KOnect/css/konect.css" />
</head>
<body>
    <div class="container py-4">
        <h2 class="mb-4">Lista de Academias Ativas</h2>

        <button class="btn-atualizar" onclick="buscarAcademias()">Atualizar Lista</button>
        <div id="mensagem"></div>

        <table class="table-simple">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome da Academia</th>
                    <th>Responsável</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>

    <script src="../../../js/admin/get_academias.js"></script>
</body>
</html>
