<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../globalstyles/style.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>Gerenciar Alunos — KOnect</title>
  </head>
  <body>
    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <a
          class="brand"
          href="../home_admin/index.html"
          style="text-decoration: none; color: white"
          >KO<span>nect</span> <span class="brand-badge">Admin</span></a
        >
        <div class="d-flex align-items-center gap-3">
          <span class="admin-name" id="adminNome"></span>
          <button class="btn-logout" onclick="logout()">
            <i class="bi bi-box-arrow-right me-1"></i>Sair
          </button>
        </div>
      </div>
    </nav>

    <main class="container">
      <div class="mb-5">
        <h2 class="fw-bold mb-3">Gerenciar Alunos</h2>
        <p class="text-muted">
          Visualize e gerencie informações de todos os alunos da plataforma.
          Para criar novos alunos, utilize o portal de matrícula.
        </p>
      </div>

      <div class="section-card">
        <div class="mb-4">
          <div class="row g-3">
            <div class="col-md-4">
              <input
                type="text"
                class="form-control"
                id="filtroNome"
                placeholder="Pesquisar por nome..."
                onkeyup="aplicarFiltros()"
              />
            </div>
            <div class="col-md-3">
              <select
                class="form-control"
                id="filtroAcademia"
                onchange="aplicarFiltros()"
              >
                <option value="">Todas as Academias</option>
              </select>
            </div>
            <div class="col-md-3">
              <select
                class="form-control"
                id="filtroStatus"
                onchange="aplicarFiltros()"
              >
                <option value="">Todos os Status</option>
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
              </select>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Academia</th>
                <th>Modalidade</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpoAlunos">
              <tr>
                <td colspan="7" class="text-center text-muted">
                  Carregando...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Modal Editar Aluno -->
    <div id="modalEditarAluno" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Editar Aluno</h3>
          <button class="btn-fechar" onclick="fecharModalEditarAluno()">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nome Completo</label>
            <input type="text" id="editAlunoNome" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="editAlunoEmail" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="tel" id="editAlunoTelefone" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select id="editAlunoStatus" class="form-control">
              <option value="Ativo">Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" onclick="fecharModalEditarAluno()">
            Cancelar
          </button>
          <button class="btn-primary" onclick="salvarAlteracoesAluno()">
            Salvar
          </button>
        </div>
      </div>
    </div>

    <script src="../../../js/admin/admin_alunos.js"></script>
  </body>
</html>
