<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect — Instrutores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../../globalstyles/style.css" />
  </head>
  <body>

    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <a class="brand" href="../../../index.html" style="text-decoration:none;color:white">KO<span>nect</span> <span class="brand-badge">Admin</span></a>
          <a href="../home_admin/index.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Painel Admin
          </a>
        </div>
        <div class="fw-bold text-muted">Módulo: Instrutores</div>
      </div>
    </nav>

    <main class="container">
      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <h2 class="fw-bold mb-1">Gerenciar Instrutores</h2>
          <p class="text-muted mb-0">Lista completa de instrutores e academias cadastradas.</p>
        </div>
        <a href="../cadastro_instrutor/cadastro_instrutor.html" class="btn btn-konect">
          <i class="bi bi-person-plus-fill me-2"></i>Novo Instrutor
        </a>
      </div>

      <div class="stat-card p-0 overflow-hidden mb-5">
        <div class="table-responsive">
          <table class="table table-dark-konect table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Responsável</th>
                <th>Academia</th>
                <th>CNPJ</th>
                <th>Horário</th>
                <th>Telefone</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaInstrutores">
              <tr><td colspan="6" class="text-center py-5 text-muted">Buscando instrutores...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Modal Editar Instrutor -->
    <div class="modal fade" id="modalEditarInstrutor" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content" style="background-color: var(--bg-card); border: 1px solid var(--border); color: white;">
          <div class="modal-header" style="border-color: var(--border);">
            <h5 class="modal-title fw-bold" id="modalEditarLabel">
              <i class="bi bi-pencil-square me-2 text-danger"></i>Editar Instrutor
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <form id="formEditarInstrutor">
            <input type="hidden" id="editIdUsuario" name="id_usuario" />
            <div class="modal-body">

              <h6 class="text-muted mb-3 border-bottom pb-2" style="border-color: var(--border) !important;">Dados do Responsável</h6>
              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="form-label">Nome completo</label>
                  <input type="text" class="form-control" id="editNome" name="nome" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">E-mail</label>
                  <input type="email" class="form-control" id="editEmail" name="email" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Telefone</label>
                  <input type="tel" class="form-control" id="editTelefone" name="telefone_responsavel" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">CPF</label>
                  <input type="text" class="form-control" id="editCpf" name="cpf" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Data de Nascimento</label>
                  <input type="date" class="form-control" id="editDataNascimento" name="dataNascimento" />
                </div>
              </div>

              <h6 class="text-muted mb-3 border-bottom pb-2" style="border-color: var(--border) !important;">Dados da Academia</h6>
              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="form-label">Nome Fantasia</label>
                  <input type="text" class="form-control" id="editNomeFantasia" name="nome_fantasia" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Razão Social</label>
                  <input type="text" class="form-control" id="editRazaoSocial" name="razao_social" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">CNPJ</label>
                  <input type="text" class="form-control" id="editCnpj" name="cnpj" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Horário de Abertura</label>
                  <input type="time" class="form-control" id="editHorarioAbertura" name="horario_abertura" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Horário de Fechamento</label>
                  <input type="time" class="form-control" id="editHorarioFechamento" name="horario_fechamento" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Academia</label>
                  <select class="form-select" id="editAcademiaId" name="academia_id">
                    <option value="">Carregando...</option>
                  </select>
                </div>
              </div>

              <h6 class="text-muted mb-3 border-bottom pb-2" style="border-color: var(--border) !important;">Dados do Plano</h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label d-block mb-2">Período do Contrato</label>
                  <div class="d-flex gap-3">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="periodo_contrato" id="editPlanoSemestral" value="semestral" />
                      <label class="form-check-label" for="editPlanoSemestral">Semestral</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="periodo_contrato" id="editPlanoAnual" value="anual" />
                      <label class="form-check-label" for="editPlanoAnual">Anual</label>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Renovação Automática</label>
                  <select class="form-select" id="editRenovacaoAutomatica" name="renovacao_automatica">
                    <option value="1">Sim</option>
                    <option value="0">Não</option>
                  </select>
                </div>
              </div>

            </div>
            <div class="modal-footer" style="border-color: var(--border);">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-danger fw-bold px-4">
                <i class="bi bi-check-lg me-1"></i> Salvar Alterações
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../js/admin/instrutores.js"></script>
  </body>
</html>
