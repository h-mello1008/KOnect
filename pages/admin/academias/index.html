<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Academias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../../globalstyles/style.css" />
  </head>
  <body>
    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <a class="brand" href="../../../index.html" style="text-decoration:none;color:white">KO<span>nect</span> <span class="brand-badge">Admin</span></a>
          <a href="../home_admin/index.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Painel Admin
          </a>
        </div>
        <div class="fw-bold text-muted">Modulo: Academias</div>
      </div>
    </nav>

    <main class="container">
      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <h2 class="fw-bold mb-1">Gerenciar Academias</h2>
          <p class="text-muted mb-0">Atualize informacoes das academias e controle seu status.</p>
        </div>
      </div>

      <div class="stat-card p-0 overflow-hidden mb-5">
        <div class="table-responsive">
          <table class="table table-dark-konect table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Nome da Academia</th>
                <th>CNPJ</th>
                <th>Endereco</th>
                <th>Status</th>
                <th>Acoes</th>
              </tr>
            </thead>
            <tbody id="corpoAcademias">
              <tr><td colspan="5" class="text-center py-5 text-muted">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <div id="modalEditarAcademia" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Editar Academia</h3>
          <button class="btn-fechar" onclick="fecharModalAcademia()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nome da Academia</label>
            <input type="text" id="editAcademiaNome" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">CNPJ (nao pode ser alterado)</label>
            <input type="text" id="editAcademiaCNPJ" class="form-control" disabled />
          </div>
          <div class="mb-3">
            <label class="form-label">Endereco</label>
            <input type="text" id="editAcademiaEndereco" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">
              <input type="checkbox" id="editAcademiaStatus" />
              Academia Ativa
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" onclick="fecharModalAcademia()">Cancelar</button>
          <button class="btn-primary" onclick="salvarAlteracoesAcademia()">Salvar</button>
        </div>
      </div>
    </div>

    <script src="../../../js/admin/admin_academias.js"></script>
  </body>
</html>
