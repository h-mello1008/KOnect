<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Academias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../../globalstyles/style.css" />
  </head>
  <body>
    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <a class="brand" href="../../../index.html" style="text-decoration:none;color:white">KO<span>nect</span> <span class="brand-badge">Admin</span></a>
          <a href="../home_admin/index.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Painel Admin
          </a>
        </div>
        <div class="fw-bold text-muted">Módulo: Academias</div>
      </div>
    </nav>

    <main class="container">
      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <h2 class="fw-bold mb-1">Gerenciar Academias</h2>
          <p class="text-muted mb-0">Atualize informações das academias e controle seu status.</p>
        </div>
        <button class="btn btn-konect" data-bs-toggle="modal" data-bs-target="#modalNovaAcademia">
          <i class="bi bi-building-add me-2"></i>Nova Academia
        </button>
      </div>

      <div id="erroAcademias" class="alert alert-danger d-none mb-3" role="alert"></div>
      <div id="sucessoAcademias" class="alert alert-success d-none mb-3" role="alert"></div>

      <div class="stat-card p-0 overflow-hidden mb-5">
        <div class="table-responsive">
          <table class="table table-dark-konect table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Nome da Academia</th>
                <th>CNPJ</th>
                <th>Endereço</th>
                <th>Status</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="corpoAcademias">
              <tr><td colspan="5" class="text-center py-5 text-muted">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Modal Nova Academia -->
    <div class="modal fade" id="modalNovaAcademia" tabindex="-1" aria-labelledby="modalNovaLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background-color: var(--bg-card); border: 1px solid var(--border); color: white;">
          <div class="modal-header" style="border-color: var(--border);">
            <h5 class="modal-title fw-bold" id="modalNovaLabel">
              <i class="bi bi-building-add me-2 text-danger"></i>Nova Academia
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <form id="formNovaAcademia">
            <div class="modal-body">
              <div id="erroNovaAcademia" class="alert alert-danger d-none mb-3"></div>
              <div class="mb-3">
                <label class="form-label">Nome da Academia <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="novaAcademiaNome" name="nome" required placeholder="Ex.: Academia Fight Club" />
              </div>
              <div class="mb-3">
                <label class="form-label">CNPJ</label>
                <input type="text" class="form-control" id="novaAcademiaCnpj" name="cnpj" placeholder="00.000.000/0000-00" />
              </div>
              <div class="mb-3">
                <label class="form-label">Endereço</label>
                <input type="text" class="form-control" id="novaAcademiaEndereco" name="endereco" placeholder="Rua, número, bairro..." />
              </div>
            </div>
            <div class="modal-footer" style="border-color: var(--border);">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" id="btnSalvarNovaAcademia" class="btn btn-danger fw-bold px-4">
                <i class="bi bi-check-lg me-1"></i> Criar Academia
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal Editar Academia -->
    <div class="modal fade" id="modalEditarAcademia" tabindex="-1" aria-labelledby="modalEditarAcademiaLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background-color: var(--bg-card); border: 1px solid var(--border); color: white;">
          <div class="modal-header" style="border-color: var(--border);">
            <h5 class="modal-title fw-bold" id="modalEditarAcademiaLabel">
              <i class="bi bi-pencil-square me-2 text-danger"></i>Editar Academia
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editAcademiaId" />
            <div class="mb-3">
              <label class="form-label">Nome da Academia</label>
              <input type="text" id="editAcademiaNome" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">CNPJ <span class="text-muted small">(não pode ser alterado)</span></label>
              <input type="text" id="editAcademiaCNPJ" class="form-control" disabled />
            </div>
            <div class="mb-3">
              <label class="form-label">Endereço</label>
              <input type="text" id="editAcademiaEndereco" class="form-control" />
            </div>
            <div class="form-check form-switch mt-3">
              <input class="form-check-input" type="checkbox" id="editAcademiaStatus" />
              <label class="form-check-label" for="editAcademiaStatus">Academia Ativa</label>
            </div>
          </div>
          <div class="modal-footer" style="border-color: var(--border);">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button id="btnSalvarEdicaoAcademia" class="btn btn-danger fw-bold px-4" onclick="salvarAlteracoesAcademia()">
              <i class="bi bi-check-lg me-1"></i> Salvar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../js/admin/admin_academias.js"></script>
  </body>
</html>
