<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Regras de Negocio</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../globalstyles/style.css" />
  </head>
  <body>
    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <a class="brand" href="../../index.html" style="text-decoration:none;color:white">KO<span>nect</span></a>
          <a href="dashboard_instrutor.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Menu Principal
          </a>
        </div>
        <div class="fw-bold text-muted">Modulo: Regras de Negocio</div>
      </div>
    </nav>

    <main class="container-fluid px-md-5">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Personalizar Regras de Graduacao</h2>
        <p class="text-muted mb-0">Configure regras de promocao por estilo de arte marcial.</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="stat-card">
            <h5 class="fw-bold mb-3"><i class="bi bi-award me-2 text-danger"></i>Nova Regra</h5>
            <form id="formNovaRegra">
              <div class="mb-3">
                <label class="form-label small text-muted">Modalidade *</label>
                <select id="novaRegraModalidade" class="form-control" required>
                  <option value="">Selecione a Modalidade</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label small text-muted">Graduacao *</label>
                <select id="novaRegraGraduacao" class="form-control" required>
                  <option value="">Selecione a Graduacao</option>
                </select>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="form-label small text-muted">Tempo Minimo</label>
                    <input type="number" id="novaRegraTempo" class="form-control" min="0" value="0" />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="form-label small text-muted">Pontuacao Minima</label>
                    <input type="number" id="novaRegraPontuacao" class="form-control" min="0" value="0" />
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label small text-muted">Descricao</label>
                <input type="text" id="novaRegraDescricao" class="form-control" />
              </div>
              <div class="mb-3">
                <label class="form-label small text-muted">Requisitos</label>
                <textarea id="novaRegraRequisitos" class="form-control" rows="3"></textarea>
              </div>
              <button type="button" class="btn btn-konect" onclick="criarNovaRegra()">
                <i class="bi bi-plus-circle me-2"></i>Criar Regra
              </button>
            </form>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="stat-card p-0 overflow-hidden">
            <div class="table-responsive">
              <table class="table table-dark-konect table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>Modalidade</th>
                    <th>Faixa</th>
                    <th>Tempo</th>
                    <th>Pontos</th>
                    <th>Descricao</th>
                    <th>Acoes</th>
                  </tr>
                </thead>
                <tbody id="corpoRegras">
                  <tr><td colspan="6" class="text-center py-5 text-muted">Carregando...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="modalEditarRegra" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Editar Regra de Graduacao</h3>
          <button class="btn-fechar" onclick="fecharModalRegra()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Tempo Minimo (meses)</label>
              <input type="number" id="editRegraTempoMinimo" class="form-control" min="0" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Pontuacao Minima</label>
              <input type="number" id="editRegraPontuacaoMinima" class="form-control" min="0" />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Descricao</label>
            <input type="text" id="editRegraDescricao" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Requisitos</label>
            <textarea id="editRegraRequisitos" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" onclick="fecharModalRegra()">Cancelar</button>
          <button class="btn-primary" onclick="salvarAlteracoesRegra()">Salvar</button>
        </div>
      </div>
    </div>

    <script src="../../js/admin/admin_graduacao_regras.js"></script>
  </body>
</html>
