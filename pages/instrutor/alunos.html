<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Gerenciar Alunos</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../globalstyles/style.css" />
  </head>
  <body>

    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <a class="brand" href="../../index.html" style="text-decoration:none;color:white">KO<span>nect</span></a>
          <a href="dashboard_instrutor.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Menu Principal
          </a>
        </div>
        <div class="fw-bold text-muted">Módulo: Alunos</div>
      </div>
    </nav>

    <main class="container">
      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
          <h2 class="fw-bold mb-1">Gerenciar Alunos</h2>
          <p class="text-muted mb-0">Lista cadastral completa de atletas vinculados.</p>
        </div>
        <a href="cadastro_aluno/index.html" class="btn btn-konect">
          <i class="bi bi-person-plus-fill me-2"></i>Novo Aluno
        </a>
      </div>

      <div class="stat-card p-0 overflow-hidden mb-5">
        <div class="table-responsive">
          <table class="table table-dark-konect table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Aluno</th>
                <th>Faixa Atual</th>
                <th class="text-center">Frequência</th>
                <th class="text-center">Status</th>
                <th class="text-end pe-4">Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaAlunos">
              <tr><td colspan="5" class="text-center py-5 text-muted">Buscando atletas...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <div class="modal fade" id="modalEditarPerfil" tabindex="-1" data-bs-theme="dark">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Gerenciar Perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formEditarPerfil">
                            <input type="hidden" id="edit_id_usuario" name="id_usuario" />
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold text-uppercase">
                                        Nome
                                    </label>
                                    <input type="text" class="form-control" id="edit_nome" name="nome" required />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold text-uppercase">
                                        Telefone
                                    </label>
                                    <input type="text" class="form-control" id="edit_telefone" name="telefone" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold text-uppercase">
                                        Plano
                                    </label>
                                    <select class="form-select" id="edit_plano" name="plano">
                                        <option value="mensal">Mensal</option>
                                        <option value="anual">Anual Premium</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold text-uppercase">
                                        Status
                                    </label>
                                    <select class="form-select" id="edit_status" name="status">
                                        <option value="Ativo">🟢 Ativo</option>
                                        <option value="Inativo">🟡 Inativo</option>
                                        <option value="Bloqueado">🔴 Bloqueado</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold text-uppercase">
                                        Atestado
                                    </label>
                                    <select class="form-select" id="edit_atestado" name="atestadoMedico">
                                        <option value="1">Regularizado</option>
                                        <option value="0">Pendente</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold text-uppercase">
                                        Condicionamento
                                    </label>
                                    <select class="form-select" id="edit_condicionamento" name="nivelCondicionamento">
                                        <option value="1">1 - Iniciante</option>
                                        <option value="5">5 - Intermediário</option>
                                        <option value="10">10 - Alta Performance</option>
                                    </select>
                                </div>
                            </div>
                    </form>
        </div>
        <div class="modal-footer border-top-0 pt-0">
            <button type="button" class="btn text-white fw-bold" data-bs-dismiss="modal">
                Cancelar
            </button>
            <button type="button" class="btn btn-konect" onclick="salvarPerfilAluno()">
                Salvar Alterações
            </button>
        </div>
        </div>
        </div>
    </div>

    <div class="modal fade" id="modalHistoricoPresenca" tabindex="-1" data-bs-theme="dark"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title fw-bold">Presenças</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><p class="text-muted">Módulo em desenvolvimento.</p></div></div></div></div>
    <div class="modal fade" id="modalEvolucaoFaixa" tabindex="-1" data-bs-theme="dark"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header border-bottom-0 pb-0"><h5 class="modal-title fw-bold">Progresso de Exame</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4" id="bodyModalFaixa"></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/KOnect/KOnect/js/instrutor/alunos.js"></script>
  </body>
</html>
