<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Fluxo de Caixa</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../globalstyles/style.css" />
  </head>
  <body>
    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <a class="brand" href="../../index.html" style="text-decoration:none;color:white">KO<span>nect</span></a>
          <a href="dashboard_instrutor.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Menu Principal
          </a>
        </div>
        <div class="fw-bold text-muted">Modulo: Fluxo de Caixa</div>
      </div>
    </nav>

    <main class="container-fluid px-md-5">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Monitorar Fluxo de Caixa</h2>
        <p class="text-muted mb-0">Acompanhe o status de pagamentos e receitas das academias.</p>
      </div>

      <div id="estatisticasFluxoCaixa" class="stats-grid mb-5">
        <div class="stat-card stat-card--green">
          <div class="stat-icon"><i class="bi bi-check-circle-fill"></i></div>
          <div class="stat-info">
            <span class="stat-label">Pago</span>
            <span class="stat-valor">R$ 0,00</span>
            <span class="stat-qty">0 mensalidades</span>
          </div>
        </div>
      </div>

      <div class="stat-card p-0 overflow-hidden">
        <div class="table-responsive">
          <table class="table table-dark-konect table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Aluno</th>
                <th>Modalidade</th>
                <th>Mes</th>
                <th>Valor</th>
                <th>Vencimento</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="corpoMensalidades">
              <tr><td colspan="6" class="text-center py-5 text-muted">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="../../js/admin/admin_fluxo_caixa.js"></script>
  </body>
</html>
