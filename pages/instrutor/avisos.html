<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Mural de Avisos</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/KOnect/css/konect.css" />
  </head>
  <body class="theme-instrutor">

    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <span class="brand">KO<span>nect</span></span>
          <a href="dashboard_instrutor.html" class="btn btn-sm btn-outline-light border-konect">
            <i class="bi bi-arrow-left"></i> Menu Principal
          </a>
        </div>
        <div class="fw-bold text-muted">Módulo: Avisos</div>
      </div>
    </nav>

    <main class="container">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Mural de Comunicação</h2>
        <p class="text-muted mb-0">Publique alertas que aparecerão diretamente no painel dos alunos.</p>
      </div>

      <div class="row g-4">
        <div class="col-md-5">
          <div class="stat-card">
            <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square me-2 text-danger"></i>Novo Aviso</h5>
            <form id="formNovoAviso">
              <div class="mb-3">
                <label class="form-label small text-muted">Título do Aviso</label>
                <input type="text" name="titulo" class="form-control form-control-instr" required placeholder="Ex: Feriado Nacional">
              </div>
              <div class="mb-3">
                <label class="form-label small text-muted">Mensagem</label>
                <textarea name="mensagem" class="form-control form-control-instr" rows="4" required placeholder="Digite os detalhes aqui..."></textarea>
              </div>
              <button type="submit" class="btn-konect w-100">Publicar Aviso</button>
            </form>
          </div>
        </div>

        <div class="col-md-7">
          <div class="stat-card h-100">
            <h5 class="fw-bold mb-4"><i class="bi bi-megaphone-fill me-2 text-danger"></i>Avisos Ativos</h5>
            <div id="listaDeAvisos">
              <p class="text-muted text-center py-4">Nenhum aviso publicado recentemente.</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/KOnect/js/instrutor/avisos.js"></script>
  </body>
</html>
