<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Mural de Avisos</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/KOnect/style.css" />
    
    <style>
      :root {
        --bg-deep: #1a0505; --bg-card: #260a0a; --border: #3d1414;
        --accent: #e11d48; --text-main: #ffffff; --text-muted: #d1a3a3;
      }
      body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'DM Sans', sans-serif; }
      h1, h2, h3, h4, h5, .brand { font-family: 'Syne', sans-serif; }
      .text-muted { color: var(--text-muted) !important; opacity: 1 !important; }

      .topnav { background-color: var(--bg-card); border-bottom: 1px solid var(--border); }
      .brand { font-weight: 800; font-size: 1.5rem; letter-spacing: -1px; }
      .brand span { color: var(--accent); }

      .stat-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
      .form-control { background-color: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text-main); }
      .form-control:focus { background-color: rgba(0,0,0,0.3); border-color: var(--accent); color: var(--text-main); box-shadow: none; }
      
      .btn-konect { background-color: var(--accent); color: white; font-weight: 700; border: none; border-radius: 8px; padding: 12px 20px; width: 100%; }
      .btn-konect:hover { background-color: #be123c; color: white; }

      .aviso-item { background-color: rgba(225, 29, 72, 0.05); border-left: 4px solid var(--accent); padding: 16px; border-radius: 0 8px 8px 0; margin-bottom: 16px; }
    </style>
  </head>
  <body>

    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <span class="brand">KO<span>nect</span></span>
          <a href="dashboard_instrutor.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Menu Principal
          </a>
        </div>
        <div class="fw-bold text-muted">Módulo: Avisos</div>
      </div>
    </nav>

    <main class="container">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Mural de Comunicação</h2>
        <p class="text-muted mb-0">Publique alertas que aparecerão diretamente no painel dos alunos.</p>
      </div>

      <div class="row g-4">
        <div class="col-md-5">
          <div class="stat-card">
            <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square me-2 text-danger"></i>Novo Aviso</h5>
            <form id="formNovoAviso">
              <div class="mb-3">
                <label class="form-label small text-muted">Título do Aviso</label>
                <input type="text" name="titulo" class="form-control" required placeholder="Ex: Feriado Nacional">
              </div>
              <div class="mb-3">
                <label class="form-label small text-muted">Mensagem</label>
                <textarea name="mensagem" class="form-control" rows="4" required placeholder="Digite os detalhes aqui..."></textarea>
              </div>
              <button type="submit" class="btn-konect">Publicar Aviso</button>
            </form>
          </div>
        </div>

        <div class="col-md-7">
          <div class="stat-card h-100">
            <h5 class="fw-bold mb-4"><i class="bi bi-megaphone-fill me-2 text-danger"></i>Avisos Ativos</h5>
            <div id="listaDeAvisos">
              <p class="text-muted text-center py-4">Nenhum aviso publicado recentemente.</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/KOnect/js/instrutor/avisos.js"></script>
  </body>
</html>
