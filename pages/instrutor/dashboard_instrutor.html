<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Hub do Instrutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../globalstyles/style.css" />
  </head>
  <body>
    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="brand" href="../../index.html" style="text-decoration:none;color:white">KO<span>nect</span></a>
        <div class="d-flex align-items-center gap-3">
          <span class="text-muted fw-bold small" id="instrutorEmail"></span>
          <button onclick="fazerLogout()" class="btn btn-outline-light btn-sm" style="border-color: var(--border);">
            <i class="bi bi-box-arrow-right"></i> Sair
          </button>
        </div>
      </div>
    </nav>

    <main class="container">
      <div class="text-center mb-5">
        <h2 class="fw-bold mb-2">Painel de Controle</h2>
        <p class="text-muted">Selecione o modulo que deseja gerenciar.</p>
      </div>

      <div class="row g-4 justify-content-center">
        <div class="col-md-4 col-sm-6">
          <a href="alunos.html" class="hub-card">
            <div class="hub-icon"><i class="bi bi-people-fill"></i></div>
            <h5 class="fw-bold">Alunos</h5>
            <p class="text-muted small mb-0">Cadastros, perfis e faixas</p>
          </a>
        </div>
        <div class="col-md-4 col-sm-6">
          <a href="agenda.html" class="hub-card">
            <div class="hub-icon"><i class="bi bi-calendar3"></i></div>
            <h5 class="fw-bold">Agenda</h5>
            <p class="text-muted small mb-0">Planejamento de aulas</p>
          </a>
        </div>
        <div class="col-md-4 col-sm-6">
          <a href="pagamentos.html" class="hub-card">
            <div class="hub-icon"><i class="bi bi-credit-card-fill"></i></div>
            <h5 class="fw-bold">Pagamentos</h5>
            <p class="text-muted small mb-0">Mensalidades e cobrancas</p>
          </a>
        </div>
        <div class="col-md-4 col-sm-6">
          <a href="avisos.html" class="hub-card">
            <div class="hub-icon"><i class="bi bi-megaphone-fill"></i></div>
            <h5 class="fw-bold">Avisos</h5>
            <p class="text-muted small mb-0">Comunicados aos alunos</p>
          </a>
        </div>
        <div class="col-md-4 col-sm-6">
          <a href="regras_negocio.html" class="hub-card">
            <div class="hub-icon"><i class="bi bi-award"></i></div>
            <h5 class="fw-bold">Regras de Negocio</h5>
            <p class="text-muted small mb-0">Criterios de graduacao</p>
          </a>
        </div>
        <div class="col-md-4 col-sm-6">
          <a href="fluxo_caixa.html" class="hub-card">
            <div class="hub-icon"><i class="bi bi-cash-coin"></i></div>
            <h5 class="fw-bold">Fluxo de Caixa</h5>
            <p class="text-muted small mb-0">Receitas e mensalidades</p>
          </a>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/KOnect/js/instrutor/dashboard_instrutor.js"></script>
  </body>
</html>
