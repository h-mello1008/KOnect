<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Agenda de Treinos</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/KOnect/style.css" />
    
    <style>
      :root {
        --bg-deep: #1a0505; --bg-card: #260a0a; --border: #3d1414;
        --accent: #e11d48; --text-main: #ffffff; --text-muted: #d1a3a3;
      }
      body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'DM Sans', sans-serif; }
      h1, h2, h3, h4, h5, .brand { font-family: 'Syne', sans-serif; }
      .text-muted { color: var(--text-muted) !important; opacity: 1 !important; }

      .topnav { background-color: var(--bg-card); border-bottom: 1px solid var(--border); }
      .brand { font-weight: 800; font-size: 1.5rem; letter-spacing: -1px; }
      .brand span { color: var(--accent); }

      .day-column { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-height: 400px; }
      .day-header { border-bottom: 2px solid var(--border); padding-bottom: 8px; font-weight: 700; text-align: center; color: var(--accent); text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
      
      .class-card { background-color: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 0.85rem; text-align: center; }
      .class-time { font-weight: 700; color: white; display: block; }
      
      .btn-konect { background-color: var(--accent); color: white; font-weight: 700; border: none; border-radius: 8px; padding: 8px 16px; text-decoration: none; font-size: 0.9rem; }
      .btn-konect:hover { background-color: #be123c; color: white; }
    </style>
  </head>
  <body>

    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <span class="brand">KO<span>nect</span></span>
          <a href="dashboard_instrutor.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Menu Principal
          </a>
        </div>
        <div class="fw-bold text-muted">Módulo: Agenda</div>
      </div>
    </nav>

    <main class="container-fluid px-md-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">Grade Horária da Semana</h2>
          <p class="text-muted mb-0">Gerenciamento tático de treinos semanais visíveis no aplicativo dos alunos.</p>
        </div>
        <button class="btn btn-konect" onclick="novaAula()"><i class="bi bi-plus-lg me-2"></i>Agendar Aula</button>
      </div>

      <div class="row g-3" id="gridSemanal">
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Segunda</div>
            <div id="classes-seg">
              </div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Terça</div>
            <div id="classes-ter"></div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Quarta</div>
            <div id="classes-qua"></div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Quinta</div>
            <div id="classes-qui"></div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Sexta</div>
            <div id="classes-sex"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/KOnect/js/instrutor/agenda.js"></script>
  </body>
</html>
