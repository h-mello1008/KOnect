<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Agenda de Treinos</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../globalstyles/style.css" />
  </head>
  <body>

    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <a class="brand" href="../../index.html" style="text-decoration:none;color:white">KO<span>nect</span></a>
          <a href="dashboard_instrutor.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Menu Principal
          </a>
        </div>
        <div class="fw-bold text-muted">Módulo: Agenda</div>
      </div>
    </nav>

    <main class="container-fluid px-md-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">Grade Horária da Semana</h2>
          <p class="text-muted mb-0">Gerenciamento tático de treinos semanais visíveis no aplicativo dos alunos.</p>
        </div>
        <button class="btn btn-konect" onclick="novaAula()"><i class="bi bi-plus-lg me-2"></i>Agendar Aula</button>
      </div>

      <div class="row g-3" id="gridSemanal">
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Segunda</div>
            <div id="classes-seg">
              </div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Terça</div>
            <div id="classes-ter"></div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Quarta</div>
            <div id="classes-qua"></div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Quinta</div>
            <div id="classes-qui"></div>
          </div>
        </div>
        <div class="col-md col-sm-6">
          <div class="day-column">
            <div class="day-header">Sexta</div>
            <div id="classes-sex"></div>
          </div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="modalNovaAula" tabindex="-1" data-bs-theme="dark">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="tituloModalAula">Agendar Aula</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="formNovaAula">
            <input type="hidden" name="id" id="agendaId">
            <div class="modal-body p-4">
              <div class="mb-3">
                <label for="diaAula" class="form-label small text-muted fw-bold text-uppercase">Dia da semana</label>
                <select id="diaAula" name="dia" class="form-select" required>
                  <option value="" selected disabled>Selecione o dia</option>
                  <option value="seg">Segunda-feira</option>
                  <option value="ter">Terça-feira</option>
                  <option value="qua">Quarta-feira</option>
                  <option value="qui">Quinta-feira</option>
                  <option value="sex">Sexta-feira</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="horaAula" class="form-label small text-muted fw-bold text-uppercase">Horário</label>
                <input id="horaAula" type="time" name="hora" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="modalidadeAula" class="form-label small text-muted fw-bold text-uppercase">Tipo de treino</label>
                <input id="modalidadeAula" type="text" name="modalidade" class="form-control" required placeholder="Ex: Muay Thai, Técnico, Sparring">
              </div>
            </div>
            <div class="modal-footer border-top-0 pt-0">
              <button type="button" class="btn text-white fw-bold" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-konect">
                <i class="bi bi-check-lg me-2"></i><span id="btnSalvarAulaTexto">Salvar Aula</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/instrutor/agenda.js"></script>
  </body>
</html>
