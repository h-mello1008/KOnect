<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOnect - Fluxo Financeiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/KOnect/style.css" />
    
    <style>
      :root {
        --bg-deep: #1a0505; --bg-card: #260a0a; --border: #3d1414;
        --accent: #e11d48; --text-main: #ffffff; --text-muted: #d1a3a3;
      }
      body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'DM Sans', sans-serif; }
      h1, h2, h3, h4, h5, .brand { font-family: 'Syne', sans-serif; }
      .text-muted { color: var(--text-muted) !important; opacity: 1 !important; }

      .topnav { background-color: var(--bg-card); border-bottom: 1px solid var(--border); }
      .brand { font-weight: 800; font-size: 1.5rem; letter-spacing: -1px; }
      .brand span { color: var(--accent); }

      .stat-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
      
      .table-dark-konect { --bs-table-bg: var(--bg-card); --bs-table-color: var(--text-main); --bs-table-border-color: var(--border); }
      .table-dark-konect th { background-color: rgba(0,0,0,0.2); color: var(--text-muted) !important; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; padding: 14px; }
      .table-dark-konect td { padding: 14px; vertical-align: middle; border-bottom: 1px solid var(--border); }
      
      .badge-sucesso { background-color: rgba(16, 185, 129, 0.2); color: #4ade80; border: 1px solid rgba(16, 185, 129, 0.4); }
      .badge-alerta { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
      .badge-perigo { background-color: rgba(225, 29, 72, 0.2); color: #ff85a2; border: 1px solid rgba(225, 29, 72, 0.4); }
    </style>
  </head>
  <body>

    <nav class="topnav py-3 mb-5">
      <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <span class="brand">KO<span>nect</span></span>
          <a href="dashboard_instrutor.html" class="btn btn-sm btn-outline-light" style="border-color: var(--border);">
            <i class="bi bi-arrow-left"></i> Menu Principal
          </a>
        </div>
        <div class="fw-bold text-muted">Módulo: Pagamentos</div>
      </div>
    </nav>

    <main class="container">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Situação Financeira</h2>
        <p class="text-muted mb-0">Controle de mensalidades, inadimplentes e cobranças.</p>
      </div>

      <div class="stat-card p-0 overflow-hidden">
        <div class="table-responsive">
          <table class="table table-dark-konect table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Nome do Aluno</th>
                <th>Plano Contratado</th>
                <th class="text-center">Status do Pagamento</th>
                <th class="text-end pe-4">Ação</th>
              </tr>
            </thead>
            <tbody id="tabelaPagamentos">
              <tr><td colspan="4" class="text-center py-5 text-muted">Carregando dados financeiros...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="/KOnect/js/instrutor/pagamentos.js"></script>
  </body>
</html>
